<!-- @dsCard group="Wren iOS" viewport="1800x940" name="Send flow" subtitle="Home → Someone → Amount → Sent, live-linked" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wren — iOS</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script>window.WREN_ASSETS="../../assets/";</script>
<script src="data.js"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="SomeoneScreen.jsx"></script>
<script type="text/babel" src="AmountScreen.jsx"></script>
<script type="text/babel" src="SentScreen.jsx"></script>
<style>html,body{background:var(--gray-10)}.stage{display:flex;gap:48px;padding:40px 48px 48px;width:max-content}.col{display:flex;flex-direction:column;gap:14px}.cap{font:var(--type-ticker);color:var(--text-secondary);letter-spacing:var(--tracking-mono)}.flash{animation:flash .6s var(--ease-out)}@keyframes flash{0%{transform:translateY(0)}35%{transform:translateY(-8px)}100%{transform:translateY(0)}}</style>
</head><body><div id="root"></div>
<script type="text/babel">
function App() {
  const ppl = window.WREN_DATA.people;
  const [person, setPerson] = React.useState(ppl[0]);
  const [ticker, setTicker] = React.useState('AAPL');
  const [amount, setAmount] = React.useState('50');
  const [pay, setPay] = React.useState('applepay');
  const [flash, setFlash] = React.useState(-1);
  const go = i => { setFlash(-1); requestAnimationFrame(() => setFlash(i)); };
  const cols = [
    ['01 HOME', <HomeScreen onSend={() => go(1)} />],
    ['02 SOMEONE', <SomeoneScreen person={person} onPick={p => { setPerson(p); go(2); }} />],
    ['03 AMOUNT', <AmountScreen {...{ person, ticker, setTicker, amount, setAmount, pay, setPay }} onContinue={() => go(3)} />],
    ['04 SENT', <SentScreen person={person} onHome={() => go(0)} />],
  ];
  return <div className="stage">{cols.map(([c, el], i) => <div key={c} className={'col' + (flash === i ? ' flash' : '')}><div className="cap">{c}</div>{el}</div>)}</div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
