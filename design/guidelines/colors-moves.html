<!-- @dsCard group="Colors" viewport="700x170" name="Moves" subtitle="Base green up, Base red down — and nowhere else" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px}.row{display:flex;gap:14px;flex-wrap:wrap}.sw{width:112px}.chip{height:72px;border-radius:20px;margin-bottom:8px}.n{font:var(--type-label);color:var(--text-primary)}.v{font:var(--type-ticker);color:var(--text-secondary);margin-top:2px}.lbl{font:var(--type-caption);color:var(--text-secondary);line-height:20px}</style></head><body><div class="row" style="align-items:flex-start"><div class="sw"><div class="chip" style="background:var(--base-green);"></div><div class="n">Up</div><div class="v">#66C800</div></div><div class="sw"><div class="chip" style="background:var(--base-red);"></div><div class="n">Down</div><div class="v">#FC401F</div></div><div style="display:flex;flex-direction:column;gap:10px;margin-left:20px;padding-top:8px"><span style="display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:var(--base-green);font:var(--type-percent);width:max-content">+1.24%</span><span style="display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:var(--base-red);font:var(--type-percent);width:max-content">−0.82%</span><span class="lbl" style="max-width:240px">Filled chip, ink text. Never as a text color on white.</span></div></div></body></html>
